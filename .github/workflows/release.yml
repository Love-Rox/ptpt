name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) — no NPM_TOKEN needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13

      # `changeset publish` shells out to `npm publish` (changesets only
      # special-cases pnpm; everything else, incl. bun, uses npm). npm performs
      # the OIDC token exchange for Trusted Publishing, so install a recent
      # Node/npm and point publishing at npmjs.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # OIDC Trusted Publishing requires npm >= 11.5.1.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - name: Install
        run: bun install --frozen-lockfile

      # Opens/updates a "Version Packages" PR, or publishes when one is merged.
      # Publishing is token-less via OIDC: each @love-rox/ptpt-* package must
      # have a Trusted Publisher configured on npmjs (repo: Love-Rox/ptpt,
      # workflow: release.yml). No NPM_TOKEN secret is used.
      - name: Changesets
        uses: changesets/action@v1.9.0
        with:
          version: bun run version
          publish: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
