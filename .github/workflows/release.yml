name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) — no NPM_TOKEN needed

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      # OIDC Trusted Publishing requires npm >= 11.5.1, which Node 24 bundles.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Opens/updates a "Version Packages" PR, or publishes when one is merged.
      # Publishing is token-less via OIDC: each @love-rox/ptpt-* package must
      # have a Trusted Publisher configured on npmjs (repo: Love-Rox/ptpt,
      # workflow: release.yml). No NPM_TOKEN secret is used.
      - name: Changesets
        uses: changesets/action@v1.9.0
        with:
          version: pnpm ci:version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
